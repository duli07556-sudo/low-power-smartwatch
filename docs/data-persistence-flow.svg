<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">智能手表数据掉电保存与恢复架构</title>
  <desc id="desc">展示运行阶段异步保存、BL24C02 地址布局，以及重新上电后的设置和步数恢复流程。</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="blueTab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#073b78"/>
      <stop offset="1" stop-color="#0d67bd"/>
    </linearGradient>
    <linearGradient id="orangeTab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c94c05"/>
      <stop offset="1" stop-color="#f18722"/>
    </linearGradient>
    <linearGradient id="memoryBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#fff6dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0a2e59" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172033"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b5ca8"/>
    </marker>
    <style>
      .cn { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .main-title { font-size: 52px; font-weight: 800; fill: #082e61; letter-spacing: 2px; }
      .subtitle { font-size: 23px; font-weight: 600; fill: #4b5565; }
      .panel { fill: #ffffff; stroke-width: 2.5; rx: 18; filter: url(#shadow); }
      .panel-title { font-size: 25px; font-weight: 700; fill: #ffffff; }
      .node { fill: #ffffff; stroke: #1768ad; stroke-width: 2.2; rx: 12; }
      .node-green { fill: #f3fbef; stroke: #4d8a2f; stroke-width: 2.2; rx: 12; }
      .node-purple { fill: #f7f1ff; stroke: #7650b6; stroke-width: 2.2; rx: 12; }
      .node-orange { fill: #fff8ef; stroke: #dc6a13; stroke-width: 2.2; rx: 12; }
      .node-gold { fill: #fffaf0; stroke: #b88312; stroke-width: 2.2; rx: 12; }
      .node-text { font-size: 19px; font-weight: 700; fill: #172033; text-anchor: middle; }
      .node-sub { font-size: 15px; font-weight: 500; fill: #4b5565; text-anchor: middle; }
      .small-label { font-size: 15px; font-weight: 700; fill: #536173; }
      .group-label { font-size: 18px; font-weight: 700; }
      .arrow { fill: none; stroke: #172033; stroke-width: 2.5; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #0b5ca8; stroke-width: 2.5; marker-end: url(#blueArrow); }
      .arrow-dashed { fill: none; stroke: #7a4eb2; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .chip-title { font-size: 22px; font-weight: 800; fill: #8a4e00; text-anchor: middle; }
      .address { font-family: Consolas, "Courier New", monospace; font-size: 18px; font-weight: 700; fill: #0a4f8c; }
      .address-text { font-size: 16px; font-weight: 600; fill: #2f3847; }
      .legend-title { font-size: 25px; font-weight: 800; fill: #ffffff; }
      .legend-text { font-size: 18px; font-weight: 650; fill: #243246; }
    </style>
  </defs>

  <rect width="1600" height="1180" fill="url(#pageBg)"/>
  <text x="800" y="66" class="cn main-title" text-anchor="middle">智能手表数据掉电保存与恢复</text>
  <text x="800" y="108" class="cn subtitle" text-anchor="middle">界面设置 · 消息队列 · DataSaveTask · BL24C02 · 开机恢复</text>

  <!-- 运行阶段 -->
  <rect x="22" y="153" width="1556" height="425" class="panel" stroke="#0b579e"/>
  <rect x="40" y="132" width="585" height="54" rx="12" fill="url(#blueTab)"/>
  <circle cx="72" cy="159" r="19" fill="#ffffff" opacity="0.98"/>
  <text x="72" y="166" class="cn" font-size="23" font-weight="800" fill="#0a579f" text-anchor="middle">1</text>
  <text x="102" y="168" class="cn panel-title">运行阶段：设置变化后异步写入 EEPROM</text>

  <rect x="48" y="205" width="616" height="325" rx="16" fill="#f7fbff" stroke="#4b93d0" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="70" y="234" class="cn group-label" fill="#0b579e">运行数据与保存请求</text>

  <rect x="68" y="266" width="168" height="82" class="node"/>
  <text x="152" y="298" class="cn node-text">设置页事件</text>
  <text x="152" y="324" class="cn node-sub">开关 / 时间确认</text>

  <rect x="286" y="266" width="168" height="82" class="node"/>
  <text x="370" y="298" class="cn node-text">更新运行数据</text>
  <text x="370" y="324" class="cn node-sub">只修改 RAM</text>

  <rect x="504" y="266" width="136" height="82" class="node-purple"/>
  <text x="572" y="298" class="cn node-text" font-size="17">DataSave</text>
  <text x="572" y="323" class="cn node-text" font-size="17">_Request()</text>

  <path d="M236 307 H286" class="arrow"/>
  <path d="M454 307 H504" class="arrow"/>

  <rect x="68" y="406" width="168" height="78" class="node-green"/>
  <text x="152" y="437" class="cn node-text">传感器更新</text>
  <text x="152" y="462" class="cn node-sub">步数 / RTC 日期</text>

  <rect x="286" y="406" width="168" height="78" class="node-green"/>
  <text x="370" y="437" class="cn node-text">HWInterface</text>
  <text x="370" y="462" class="cn node-sub">统一运行数据区</text>

  <path d="M236 445 H286" class="arrow"/>

  <rect x="704" y="315" width="180" height="100" class="node-purple"/>
  <text x="794" y="350" class="cn node-text">DataSave</text>
  <text x="794" y="377" class="cn node-text">消息队列</text>
  <text x="794" y="400" class="cn node-sub">非阻塞投递请求</text>

  <path d="M640 307 H674 Q694 307 694 327 V347 Q694 365 704 365" class="arrow"/>
  <path d="M454 445 H674 Q694 445 694 425 V383 Q694 365 704 365" class="arrow"/>

  <rect x="934" y="315" width="180" height="100" class="node-purple"/>
  <text x="1024" y="353" class="cn node-text">DataSaveTask</text>
  <text x="1024" y="380" class="cn node-sub">集中组织保存数据</text>
  <text x="1024" y="402" class="cn node-sub">避免阻塞 LVGL</text>
  <path d="M884 365 H934" class="arrow"/>

  <rect x="1158" y="326" width="126" height="78" class="node-gold"/>
  <text x="1221" y="357" class="cn node-text">软件 I²C</text>
  <text x="1221" y="382" class="cn node-sub">统一写操作</text>
  <path d="M1114 365 H1158" class="arrow"/>

  <rect x="1320" y="208" width="226" height="322" rx="16" fill="url(#memoryBg)" stroke="#b98210" stroke-width="2.4"/>
  <rect x="1352" y="228" width="162" height="42" rx="21" fill="#fff0ba" stroke="#c49323" stroke-width="1.5"/>
  <text x="1433" y="256" class="cn chip-title">BL24C02</text>
  <text x="1433" y="290" class="cn node-sub">256 Byte · 0x00～0xFF</text>
  <line x1="1343" y1="309" x2="1523" y2="309" stroke="#dcc17c" stroke-width="1.5"/>
  <text x="1345" y="342" class="address">0x00–0x01</text>
  <text x="1345" y="367" class="cn address-text">0x55 / 0xAA 标志</text>
  <line x1="1343" y1="385" x2="1523" y2="385" stroke="#e4cf98" stroke-width="1.2"/>
  <text x="1345" y="418" class="address">0x10–0x13</text>
  <text x="1345" y="443" class="cn address-text">四项用户设置</text>
  <line x1="1343" y1="461" x2="1523" y2="461" stroke="#e4cf98" stroke-width="1.2"/>
  <text x="1345" y="494" class="address">0x20–0x22</text>
  <text x="1345" y="519" class="cn address-text">日期 + 16 位步数</text>
  <path d="M1284 365 H1320" class="arrow"/>

  <rect x="711" y="467" width="573" height="66" rx="12" fill="#eef7ff" stroke="#6a9dca" stroke-width="1.6"/>
  <circle cx="744" cy="500" r="20" fill="#0b5ca8"/>
  <text x="744" y="508" class="cn" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">i</text>
  <text x="777" y="493" class="cn" font-size="17" font-weight="700" fill="#173a60">界面回调只投递消息，EEPROM 写入由保存任务执行</text>
  <text x="777" y="517" class="cn" font-size="15" font-weight="500" fill="#4a6078">设置改变无需等待主页刷新，也无需等待 STOP 唤醒</text>

  <!-- 上电恢复阶段 -->
  <rect x="22" y="622" width="1556" height="390" class="panel" stroke="#dc6411"/>
  <rect x="40" y="601" width="535" height="54" rx="12" fill="url(#orangeTab)"/>
  <circle cx="72" cy="628" r="19" fill="#ffffff" opacity="0.98"/>
  <text x="72" y="635" class="cn" font-size="23" font-weight="800" fill="#d65f0d" text-anchor="middle">2</text>
  <text x="102" y="637" class="cn panel-title">重新上电：校验、恢复设置与当天步数</text>

  <rect x="51" y="680" width="548" height="275" rx="16" fill="#fffaf5" stroke="#e59355" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="72" y="710" class="cn group-label" fill="#c6530a">EEPROM 检查链路</text>

  <rect x="71" y="752" width="166" height="86" class="node-orange"/>
  <text x="154" y="785" class="cn node-text">HardwareInitTask</text>
  <text x="154" y="812" class="cn node-sub">硬件初始化任务</text>

  <rect x="282" y="752" width="146" height="86" class="node-orange"/>
  <text x="355" y="785" class="cn node-text">EEPROM_Init</text>
  <text x="355" y="812" class="cn node-sub">软件 I²C 初始化</text>

  <path d="M237 795 H282" class="arrow"/>

  <polygon points="508,730 584,795 508,860 432,795" fill="#fff5e8" stroke="#dc6a13" stroke-width="2.3"/>
  <text x="508" y="788" class="cn node-text">检查</text>
  <text x="508" y="814" class="cn node-text">0x55 / 0xAA</text>
  <path d="M428 795 H432" class="arrow"/>

  <path d="M508 860 V900 H332" class="arrow"/>
  <text x="520" y="884" class="cn small-label" fill="#c6530a">无效</text>
  <rect x="82" y="874" width="250" height="64" class="node-gold"/>
  <text x="207" y="901" class="cn node-text">尝试写入检查标志</text>
  <text x="207" y="925" class="cn node-sub">无法恢复时保留安全默认值</text>

  <path d="M584 795 H630" class="arrow"/>
  <text x="596" y="779" class="cn small-label" fill="#3e7b24">有效</text>

  <rect x="637" y="672" width="190" height="91" class="node-green"/>
  <text x="732" y="704" class="cn node-text">读取 0x10～0x13</text>
  <text x="732" y="730" class="cn node-sub">逐项校验用户设置</text>
  <text x="732" y="750" class="cn node-sub">无效项使用默认值</text>

  <rect x="637" y="824" width="190" height="91" class="node-green"/>
  <text x="732" y="856" class="cn node-text">读取 0x20～0x22</text>
  <text x="732" y="882" class="cn node-sub">保存日期 + 16 位步数</text>
  <text x="732" y="902" class="cn node-sub">高字节 / 低字节</text>

  <path d="M630 795 V718 H637" class="arrow"/>
  <path d="M630 795 V870 H637" class="arrow"/>

  <rect x="874" y="672" width="204" height="91" class="node-purple"/>
  <text x="976" y="704" class="cn node-text">恢复四项设置</text>
  <text x="976" y="730" class="cn node-sub">抬腕 / APP 同步</text>
  <text x="976" y="750" class="cn node-sub">亮屏时间 / STOP 时间</text>
  <path d="M827 718 H874" class="arrow"/>

  <polygon points="976,807 1069,870 976,933 883,870" fill="#f8f2ff" stroke="#7650b6" stroke-width="2.3"/>
  <text x="976" y="862" class="cn node-text">保存日期</text>
  <text x="976" y="888" class="cn node-text">等于当天？</text>
  <path d="M827 870 H883" class="arrow"/>

  <rect x="1120" y="793" width="188" height="70" class="node-green"/>
  <text x="1214" y="822" class="cn node-text">恢复原步数</text>
  <text x="1214" y="846" class="cn node-sub">是：写回计步器</text>
  <path d="M1069 850 H1120" class="arrow"/>
  <text x="1081" y="837" class="cn small-label" fill="#3e7b24">是</text>

  <rect x="1120" y="883" width="188" height="70" class="node-orange"/>
  <text x="1214" y="912" class="cn node-text">从零开始统计</text>
  <text x="1214" y="936" class="cn node-sub">否：不恢复旧步数</text>
  <path d="M1069 891 H1092 Q1104 891 1104 906 V918 H1120" class="arrow"/>
  <text x="1081" y="909" class="cn small-label" fill="#c6530a">否</text>

  <rect x="1360" y="715" width="174" height="114" class="node"/>
  <text x="1447" y="752" class="cn node-text">HWInterface</text>
  <text x="1447" y="780" class="cn node-sub">运行数据恢复完成</text>
  <text x="1447" y="805" class="cn node-sub">供界面与任务读取</text>
  <path d="M1078 718 H1331 Q1344 718 1344 737 V750 H1360" class="arrow"/>
  <path d="M1308 828 H1330 Q1344 828 1344 805 V795 H1360" class="arrow"/>
  <path d="M1308 918 H1330 Q1344 918 1344 895 V808 Q1344 795 1360 795" class="arrow"/>

  <rect x="1352" y="865" width="190" height="93" rx="12" fill="#fff9e9" stroke="#c18b15" stroke-width="1.8"/>
  <circle cx="1380" cy="895" r="17" fill="#e49a13"/>
  <text x="1380" y="902" class="cn" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">!</text>
  <text x="1407" y="892" class="cn" font-size="15" font-weight="700" fill="#704500">0x55 / 0xAA 仅表示</text>
  <text x="1407" y="916" class="cn" font-size="15" font-weight="700" fill="#704500">基本读写有效</text>
  <text x="1407" y="940" class="cn" font-size="14" fill="#765c34">不能代替数据校验和</text>

  <!-- 底部总结 -->
  <rect x="22" y="1042" width="1556" height="112" rx="16" fill="#ffffff" stroke="#0b579e" stroke-width="2.3" filter="url(#shadow)"/>
  <rect x="42" y="1061" width="286" height="74" rx="12" fill="url(#blueTab)"/>
  <text x="185" y="1107" class="cn legend-title" text-anchor="middle">一句话理解保存链路</text>

  <rect x="354" y="1061" width="340" height="74" rx="12" fill="#f1f7ff" stroke="#2d78ba" stroke-width="1.8"/>
  <circle cx="386" cy="1098" r="21" fill="#1768ad"/>
  <text x="386" y="1106" class="cn" font-size="23" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="420" y="1091" class="cn legend-text">设置改变：更新 RAM</text>
  <text x="420" y="1116" class="cn" font-size="15" fill="#52667d">界面线程立即返回</text>

  <rect x="718" y="1061" width="388" height="74" rx="12" fill="#f8f2ff" stroke="#7650b6" stroke-width="1.8"/>
  <circle cx="750" cy="1098" r="21" fill="#7650b6"/>
  <text x="750" y="1106" class="cn" font-size="23" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="784" y="1091" class="cn legend-text">队列通知：保存任务写入</text>
  <text x="784" y="1116" class="cn" font-size="15" fill="#66537d">软件 I²C 集中访问 EEPROM</text>

  <rect x="1130" y="1061" width="428" height="74" rx="12" fill="#f3fbef" stroke="#4d8a2f" stroke-width="1.8"/>
  <circle cx="1162" cy="1098" r="21" fill="#4d8a2f"/>
  <text x="1162" y="1106" class="cn" font-size="23" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="1196" y="1091" class="cn legend-text">重新上电：恢复有效设置</text>
  <text x="1196" y="1116" class="cn" font-size="15" fill="#4d6842">日期一致时恢复当天步数</text>
</svg>
